{% extends "base.html" %}
{% block title %}New envelope{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<section class="card">
  <h1>Send a document</h1>
  <p class="muted">Upload the PDF. Next you'll add signers and show them where to sign.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>PDF document <input type="file" name="document" accept="application/pdf,.pdf" required><small class="muted">Up to {{ max_mb }} MB. Convert Word files to PDF first (Rotary's Convert tab can do it).</small></label>
    <label>Title <input name="title" placeholder="Defaults to the file name" maxlength="200"></label>
    <button class="btn" type="submit">Continue</button>
  </form>
</section>
{% endblock %}
