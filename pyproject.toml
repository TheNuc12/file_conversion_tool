[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotary-convert"
version = "0.3.0"
description = "Convert files between formats from a rotary-dial desktop app or the command line, and sign PDFs, locally or through a self-hosted signing server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.1",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "pypdfium2>=4.20",
    "reportlab>=4.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
server = ["flask>=3.0", "waitress>=3.0", "pyhanko>=0.25"]
test = ["pytest>=8", "playwright>=1.40"]

[project.scripts]
rotary = "rotary.cli:main"

rotary-sign = "rotary.sign.cli:main"

[project.gui-scripts]
rotary-app = "rotary.app:main"

[tool.setuptools.packages.find]
include = ["rotary*"]

[tool.setuptools.package-data]
"rotary.web" = ["static/*"]
"rotary.sign" = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: starts LibreOffice or a browser",
]
